spring:
  application:
    name: finance-app-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financeapp}
    username: ${DB_USER:financeapp}
    password: ${DB_PASSWORD:financeapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  version: 0.0.1-SNAPSHOT
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

dgs:
  graphql:
    graphiql:
      enabled: true
